<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 01</title>
</head>
<body>
  <main class="app">
    <div>
      <header>
        <h1>Atividade 01</h1>
      </header>

      <div>
        <canvas
          id="screen"
          class="screen"
          width="8"
          height="8"
          tabindex="0"
          aria-label="Área de desenho">
        </canvas>
      </div>

      <div>
        <h2>Controles</h2>
        <ul>
          <li><span>8</span> / <span>W</span> &rarr; cima</li>
          <li><span>2</span> / <span>S</span> &rarr; baixo</li>
          <li><span>4</span> / <span>A</span> &rarr; esquerda</li>
          <li><span>6</span> / <span>D</span> &rarr; direita</li>
          <li><span>5</span> / <span>X</span> &rarr; limpar desenho</li>
          <li><span>ESC</span> &rarr; encerrar</li>
        </ul>
      </div>
    </div>
  </main>
</body>
</html>
